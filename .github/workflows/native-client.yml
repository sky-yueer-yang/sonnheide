name: Native desktop client
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 16.2 for the pinned Tint C++20 compiler
        if: runner.os == 'macOS'
        shell: bash
        env:
          # macos-14 defaults to Xcode 15.4; pinned Tint needs aggregate CTAD.
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md#xcode
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun clang++ --version
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          printf 'CC=%s\n' "$(xcrun --find clang)" >> "$GITHUB_ENV"
          printf 'CXX=%s\n' "$(xcrun --find clang++)" >> "$GITHUB_ENV"
          xcrun clang++ -std=c++20 -x c++ -fsyntax-only - <<'CPP'
          #include <variant>
          template<class... Ts> struct overloaded : Ts... { using Ts::operator()...; };
          int main() {
            std::variant<int, float> value{1};
            return std::visit(overloaded{[](int) { return 0; }, [](float) { return 0; }}, value);
          }
          CPP
      - name: Prepare the pinned native compiler and independent libraries
        run: python tools/vendor_native.py --allow-upstream
      - name: Verify full global geography and cook real PBR skies and native shaders
        run: python tools/prepare_phase1.py --allow-upstream
      - name: Build the actual application entirely from verified offline resources
        run: python tools/build_native.py --offline --jobs 3
      - name: Build all finite correctness targets
        run: cmake --build .build/native --config RelWithDebInfo --parallel 3
      - name: Test actual native UI layout, presentation and core invariants
        run: ctest --test-dir .build/native -C RelWithDebInfo --output-on-failure
      # Hosted runners have no player desktop. Compilation and NullRenderer layout tests
      # do not establish Windows GPU/Steam Overlay/device behavior.
