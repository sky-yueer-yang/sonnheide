name: Native desktop client
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-client-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Select Xcode 16.2 for the pinned Tint C++20 compiler
        if: runner.os == 'macOS'
        shell: bash
        env:
          # macos-14 defaults to Xcode 15.4; pinned Tint needs aggregate CTAD.
          # https://github.com/actions/runner-images/blob/main/images/macos/macos-14-Readme.md#xcode
          DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
        run: |
          xcodebuild -version
          xcrun clang++ --version
          printf 'DEVELOPER_DIR=%s\n' "$DEVELOPER_DIR" >> "$GITHUB_ENV"
          printf 'CC=%s\n' "$(xcrun --find clang)" >> "$GITHUB_ENV"
          printf 'CXX=%s\n' "$(xcrun --find clang++)" >> "$GITHUB_ENV"
          xcrun clang++ -std=c++20 -x c++ -fsyntax-only - <<'CPP'
          #include <variant>
          template<class... Ts> struct overloaded : Ts... { using Ts::operator()...; };
          int main() {
            std::variant<int, float> value{1};
            return std::visit(overloaded{[](int) { return 0; }, [](float) { return 0; }}, value);
          }
          CPP
      - name: Prepare the pinned native compiler and independent libraries
        run: python tools/vendor_native.py --allow-upstream
      - name: Reuse the pinned shader compiler for this source and toolchain
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .build/shader-tools
          key: shaderc-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('data/native_dependencies.lock.json', 'tools/cook_ground_sky.py', '.github/workflows/native-client.yml') }}
      - name: Verify full global geography and cook real PBR skies and native shaders
        run: python tools/prepare_phase1.py --allow-upstream
      - name: Verify portable World presentation identity against actual Metal evidence
        run: >-
          python -c "import json, pathlib;
          expected=json.loads(pathlib.Path('docs/planning/PHASE1_EVIDENCE.json').read_text(encoding='utf-8'))['recipe_hash'];
          actual=json.loads(pathlib.Path('.build/ground-sky-runtime/runtime.json').read_text(encoding='utf-8'))['recipe_hash'];
          assert actual == expected, (actual, expected);
          print('PASS: Windows/Metal share canonical World presentation identity', actual)"
      - name: Build all targets and run complete acceptance once from verified offline resources
        run: python tools/build_native.py --offline --jobs 3
      # Hosted runners have no player desktop. Compilation and NullRenderer layout tests
      # do not establish Windows GPU/Steam Overlay/device behavior.
