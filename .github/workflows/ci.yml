name: Sonnheide foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  kernel:
    name: Kernel / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
          lfs: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Rebuild source-derived catalogs and original geometry
        run: |
          python tools/extract_catalogs.py
          python tools/build_grayboxes.py
          python tools/validate_project.py
          git diff --exit-code
      - name: Configure
        run: cmake -S . -B .build/ci -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build .build/ci --config Debug --parallel 2
      - name: Test
        run: ctest --test-dir .build/ci -C Debug --output-on-failure
  sanitizers:
    name: Kernel / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Configure
        run: cmake -S . -B .build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DSONNHEIDE_SANITIZERS=ON
      - name: Build
        run: cmake --build .build/sanitizers --parallel 2
      - name: Test
        run: ctest --test-dir .build/sanitizers --output-on-failure
