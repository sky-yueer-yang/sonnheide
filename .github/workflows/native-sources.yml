name: Locked native source hosting
on:
  push:
    branches: [codex/unified-inspectors-and-world-tools]
    paths:
      - 'data/native_dependencies.lock.json'
      - 'assets/manifests/native_fonts.json'
      - 'tools/publish_native_sources.py'
      - '.github/workflows/native-sources.yml'
  workflow_dispatch:
concurrency:
  group: native-sources-v1
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify locked original archives and host on project GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/publish_native_sources.py
