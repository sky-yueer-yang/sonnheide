name: Native Windows foundation
on:
  push:
    branches: ['codex/**', main]
    paths: ['src/**', 'apps/**', 'tests/**', 'tools/**', 'assets/**', 'data/**', 'third_party/**', 'cmake/**', 'CMakeLists.txt', '.gitattributes', 'Play_Sonnheide.command', '.github/workflows/native.yml']
  pull_request:
    paths: ['src/**', 'apps/**', 'tests/**', 'tools/**', 'assets/**', 'data/**', 'third_party/**', 'cmake/**', 'CMakeLists.txt', '.gitattributes', 'Play_Sonnheide.command', '.github/workflows/native.yml']
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.9'
      - name: Unified all-target build and complete CTest
        run: python tools/build.py --jobs 4 --bundle
      - name: Preserve build and test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-build-evidence
          path: |
            .build/native/build.log
            .build/native/Testing/Temporary/LastTest.log
            .build/package/Sonnheide
          if-no-files-found: warn
# Hosted CI is compile/core/UI-contract evidence only. It never claims GPU or Steam execution.
