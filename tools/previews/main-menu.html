<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#100e0b">
  <title>Sonnheide — 主页面</title>
  <link rel="stylesheet" href="main-menu.css">
  <script src="main-menu.js" defer></script>
</head>
<body>
  <div class="paintings" aria-hidden="true">
    <img class="painting" id="painting-a" alt="" src="../../assets/source/ui/paintings/painting-03.jpg" fetchpriority="high">
    <img class="painting" id="painting-b" alt="" src="../../assets/source/ui/paintings/painting-03.jpg">
  </div>
  <div class="shade" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <div class="company-signature">
    <div class="logo-glow" aria-hidden="true"></div>
    <img class="logo-rays" src="../../assets/source/ui/branding/sonnreich-compass.svg" alt="" aria-hidden="true" width="1000" height="1000">
    <img class="company-logo" src="../../assets/source/ui/branding/sonnreich_logo_transparent_fullsize.png" alt="Sonnreich" width="180" height="180">
  </div>

  <main class="main-layout">
    <h1>SONNHEIDE</h1>
    <nav class="main-nav" data-label="mainMenu" aria-label="主菜单">
      <button type="button" class="menu-action" data-action="new" data-i18n="new">创建世界</button>
      <button type="button" class="menu-action" data-action="continue" data-i18n="continue" data-label="noSaveExplanation" disabled aria-disabled="true">继续</button>
      <button type="button" class="menu-action" data-action="load" data-i18n="load">载入世界</button>
      <button type="button" class="menu-action" data-action="settings" data-i18n="settings">设置</button>
      <button type="button" class="menu-action" data-action="quit" data-i18n="quit">退出</button>
    </nav>
  </main>
  <div id="announcer" class="sr-only" aria-live="polite"></div>

  <dialog id="menu-dialog" aria-labelledby="dialog-title">
    <div class="dialog-layout">
      <button type="button" class="dialog-close" id="close-dialog" data-i18n="close">关闭</button>
      <h2 id="dialog-title"></h2>
      <div id="dialog-content"></div>
    </div>
  </dialog>
  <template id="settings-template">
    <div class="settings-content">
      <section class="setting-section">
        <h3 data-i18n="language">语言</h3>
        <div class="choice-row" role="group" data-label="language" aria-label="语言">
          <button type="button" class="choice" data-locale="zh">简体中文</button>
          <button type="button" class="choice" data-locale="en">English</button>
          <button type="button" class="choice" data-locale="de">Deutsch</button>
        </div>
      </section>
      <section class="setting-section">
        <h3 data-i18n="motionTitle">油画动画</h3>
        <button type="button" class="choice" id="reduce-motion" data-i18n="reduceMotion" aria-pressed="false">减弱动画</button>
        <p class="setting-description" data-i18n="motionDescription">关闭自动换画与移动，仍可手动换画。</p>
        <div class="choice-row painting-options">
          <button type="button" class="choice" id="previous-painting" data-i18n="previousPainting">上一幅</button>
          <button type="button" class="choice" id="pause-paintings" data-i18n="pausePaintings" aria-pressed="false">暂停</button>
          <button type="button" class="choice" id="next-painting" data-i18n="nextPainting">下一幅</button>
        </div>
      </section>
      <button type="button" class="text-action settings-about" data-action="about" data-i18n="about">关于</button>
      <p class="setting-description preference-failure" id="settings-storage-note" hidden></p>
    </div>
  </template>
  <noscript><p class="noscript-notice">此原型需要 JavaScript / This preview requires JavaScript / Diese Vorschau benötigt JavaScript.</p></noscript>
</body>
</html>
