<meta charset="utf-8">
<div id="sonnheide-construction-preview">
  <div class="viz-row">
    <button type="button" class="construction-action" data-play><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5 19 12 8 19Z" fill="currentColor"/></svg><span data-play-label>播放建造过程</span></button>
    <span data-phase aria-live="polite">材料运往前侧</span>
  </div>
  <svg class="construction-scene" role="img" aria-label="人物把材料送到建筑前侧并离开，长方体铁丝网从下向上分层围起，施工期间完全包围，完工后从上向下拆除。"></svg>
  <label class="form-label" for="sonnheide-construction-time">演示时间 <span class="tabular-nums" data-time>0.0</span> / 15 秒</label>
  <input id="sonnheide-construction-time" class="form-range" type="range" min="0" max="15" step="0.05" value="0" aria-label="建造过程时间">
  <div class="text-small" data-detail>送货 4 秒 · 围网 3 秒 · 全包围演示 5 秒 · 撤网 3 秒</div>
</div>
<style>
  #sonnheide-construction-preview { --foreground:#e1d7c0; --muted:#292b2c; --border:#5e594a; --secondary:#55503f; --accent:#b99c63; --background:#101416; color:var(--foreground); background:var(--background); padding:18px; }
  #sonnheide-construction-preview .construction-action { display:inline-flex; align-items:center; gap:8px; font:inherit; color:#c7ac75; background:transparent; border:0; outline:0; box-shadow:none; padding:10px 12px; cursor:pointer; }
  #sonnheide-construction-preview .construction-action:hover,
  #sonnheide-construction-preview .construction-action:focus-visible { color:#fff0c8; background:#b59b6920; }
  #sonnheide-construction-preview .construction-scene { display:block; width:100%; overflow:visible; }
  #sonnheide-construction-preview .construction-scene text { fill:var(--foreground); }
  #sonnheide-construction-preview .ground { fill:var(--muted); fill-opacity:.45; stroke:var(--border); }
  #sonnheide-construction-preview .building { fill:var(--secondary); stroke:var(--foreground); stroke-opacity:.55; }
  #sonnheide-construction-preview .mesh { fill:none; stroke:var(--foreground); stroke-width:1; }
  #sonnheide-construction-preview .mesh-back { stroke-opacity:.22; }
  #sonnheide-construction-preview .mesh-front { stroke-opacity:.75; }
  #sonnheide-construction-preview .frame { stroke:var(--foreground); stroke-width:1.6; fill:none; }
  #sonnheide-construction-preview .cargo { fill:var(--accent); stroke:var(--foreground); stroke-width:1; }
  #sonnheide-construction-preview .person { fill:var(--foreground); stroke:var(--foreground); stroke-width:2.2; stroke-linecap:round; }
  #sonnheide-construction-preview .door { fill:var(--background); stroke:var(--foreground); }
  #sonnheide-construction-preview .road { fill:var(--muted); stroke:var(--border); }
</style>
<script>
(() => {
  const root = document.getElementById('sonnheide-construction-preview');
  const svg = root.querySelector('.construction-scene');
  const button = root.querySelector('[data-play]');
  const buttonLabel = root.querySelector('[data-play-label]');
  const buttonIcon = button.querySelector('path');
  const setButton = (label, paused=false) => {buttonLabel.textContent=label;buttonIcon.setAttribute('d',paused?'M7 5H10V19H7ZM14 5H17V19H14Z':'M8 5 19 12 8 19Z');};
  const slider = root.querySelector('input');
  const phaseLabel = root.querySelector('[data-phase]');
  const timeLabel = root.querySelector('[data-time]');
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ns = 'http://www.w3.org/2000/svg';
  const plan = {delivery:4, raise:3, hold:5, lower:3, height:3.3, layerHeight:0.75, meshPitch:0.25};
  const total = plan.delivery + plan.raise + plan.hold + plan.lower;
  let time = 0, playing = false, previous = null, raf = 0;
  const stateWriter = 'construction-' + String(performance.timeOrigin);
  let width = 736, height = 330, scale = 25;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const sceneState = t => {
    const raised=plan.delivery+plan.raise, completed=raised+plan.hold;
    if(t < plan.delivery) return {phase:'DELIVERY', label:'材料运往前侧', coverage:0, finished:false};
    if(t < raised) return {phase:'RAISING', label:'铁丝网逐层围起', coverage:(t-plan.delivery)/plan.raise, finished:false};
    if(t < completed) return {phase:'ENCLOSED', label:'全包围 · 自动施工', coverage:1, finished:false};
    if(t < total) return {phase:'LOWERING', label:'建筑已完成 · 逐层撤网', coverage:1-(t-completed)/plan.lower, finished:true};
    return {phase:'READY', label:'建筑完成', coverage:0, finished:true};
  };
  const point = ([x,y,z]) => [width*.54+scale*(x*.85+z*.64), height*.59+scale*(x*.20-z*.32-y*.95)];
  const element = (tag, attributes, parent=svg) => {
    const node = document.createElementNS(ns, tag);
    for(const [key,value] of Object.entries(attributes)) node.setAttribute(key,String(value));
    parent.appendChild(node); return node;
  };
  const polygon = (points, cls, opacity=1) => element('polygon', {points:points.map(p=>point(p).join(',')).join(' '), class:cls, opacity});
  const line = (a,b,cls) => {const p=point(a), q=point(b); element('line', {x1:p[0],y1:p[1],x2:q[0],y2:q[1],class:cls});};
  const box = (x,y,z,sx,sy,sz,cls) => {
    const x0=x-sx/2,x1=x+sx/2,z0=z-sz/2,z1=z+sz/2,y1=y+sy;
    polygon([[x0,y,z0],[x1,y,z0],[x1,y1,z0],[x0,y1,z0]],cls);
    polygon([[x1,y,z0],[x1,y,z1],[x1,y1,z1],[x1,y1,z0]],cls);
    polygon([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],cls);
  };
  const panel = (side, bottom, top, pitch, cls, doorOpen=false) => {
    const sidePoint = (u,y) => side===0 ? [u,y,-4] : side===1 ? [4,y,u] : side===2 ? [u,y,4] : [-4,y,u];
    // At completion only the front doorway clears immediately; the remaining mesh lowers normally.
    const segments = (u0,u1,y) => {
      if(doorOpen && side===0 && y<2.3){
        line(sidePoint(u0,y),sidePoint(-.8,y),cls);line(sidePoint(.8,y),sidePoint(u1,y),cls);
      }else line(sidePoint(u0,y),sidePoint(u1,y),cls);
    };
    for(let y=bottom;y<top-0.001;y+=pitch) segments(-4,4,y);
    segments(-4,4,top);
    for(let u=-4;u<=4.001;u+=pitch){
      const lo=doorOpen && side===0 && Math.abs(u)<.8 ? Math.max(bottom,2.3) : bottom;
      if(top>lo) line(sidePoint(u,lo),sidePoint(u,top),cls);
    }
  };
  const layerHeight = (i,coverage) => {
    const count = Math.ceil(plan.height/plan.layerHeight);
    const fraction = clamp(count*coverage-i,0,1);
    const bottom=i*plan.layerHeight;
    return {bottom,top:bottom+Math.min(plan.layerHeight,plan.height-bottom)*fraction,fraction};
  };
  const meshSides = (coverage,sides,cls,doorOpen) => {
    for(let i=0;i<Math.ceil(plan.height/plan.layerHeight);i++){
      const band=layerHeight(i,coverage);if(band.fraction<=0) continue;
      for(const side of sides) panel(side,band.bottom,band.top,plan.meshPitch,cls,doorOpen);
    }
  };
  const draw = () => {
    const state=sceneState(time);
    const count=Math.ceil(plan.height/plan.layerHeight);
    const visibleTop=Math.max(0,...Array.from({length:count},(_,i)=>{const band=layerHeight(i,state.coverage);return band.fraction>0?band.top:0;}));
    svg.replaceChildren();
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.setAttribute('height',height);
    svg.dataset.phase=state.phase;
    svg.dataset.coverage=state.coverage.toFixed(4);
    svg.dataset.finished=String(state.finished);
    const desc=element('desc',{});desc.textContent=state.label;
    polygon([[-6,0,-6],[6,0,-6],[6,0,6],[-6,0,6]],'ground');
    polygon([[-1.4,0,-12],[1.4,0,-12],[1.4,0,-4.6],[-1.4,0,-4.6]],'road');
    polygon([[1.4,.01,-6],[3.4,.01,-6],[3.4,.01,-4.3],[1.4,.01,-4.3]],'ground');
    if(state.coverage>0){
      meshSides(state.coverage,[2,3],'mesh mesh-back',state.finished);
      line([-4,0,4],[-4,visibleTop,4],'frame');
    }
    if(state.phase!=='DELIVERY') box(0,.01,0,7.8,.25,7.8,'building');
    if(state.finished){
      box(0,.26,0,7.6,2.7,7.6,'building');
      box(0,2.96,0,8,.34,8,'building');
      polygon([[-.75,.26,-3.81],[.75,.26,-3.81],[.75,2.45,-3.81],[-.75,2.45,-3.81]],'door');
    }
    if(state.coverage>0){
      meshSides(state.coverage,[0,1],'mesh mesh-front',state.finished);
      const topLayer=layerHeight(count-1,state.coverage);
      for(const [x,z] of [[-4,-4],[4,-4],[4,4]]) line([x,0,z],[x,visibleTop,z],'frame');
      if(topLayer.fraction>0){
        const end=-4+8*topLayer.fraction;
        for(let x=-4;x<=end+.001;x+=plan.meshPitch) line([x,plan.height,-4],[x,plan.height,4],'mesh mesh-front');
        for(let z=-4;z<=4.001;z+=plan.meshPitch) line([-4,plan.height,z],[end,plan.height,z],'mesh mesh-front');
      }
    }
    if(time<4){
      const arrived=time>=1.6;
      const progress=time<1.6 ? time/1.6 : time<2.4 ? 1 : 1-(time-2.4)/1.6;
      const travel=clamp(progress,0,1), x=2*clamp((travel-.65)/.35,0,1), z=-10+4.8*travel;
      if(arrived) box(2.8,.04,-5.2,.7,.5,.8,'cargo');
      const head=point([x,1.6,z]);element('circle',{cx:head[0],cy:head[1],r:scale*.16,class:'person'});
      line([x,1.4,z],[x,.65,z],'person');
      const stride=Math.sin(time*8)*.18;
      line([x,.65,z],[x-.2,0,z+stride],'person');line([x,.65,z],[x+.2,0,z-stride],'person');
      line([x,1.25,z],[x-.28,.9,z-.12],'person');line([x,1.25,z],[x+.28,.9,z-.12],'person');
      if(!arrived) box(x,.65,z-.3,.7,.45,.45,'cargo');
    }
    const anchor=point([2.4,0,-5.2]);
    const label=element('text',{x:anchor[0],y:Math.min(height-12,anchor[1]+27),'text-anchor':'middle'});
    label.textContent='前侧接货区';
    if(phaseLabel.textContent!==state.label) phaseLabel.textContent=state.label;
    timeLabel.textContent=time.toFixed(1);slider.value=String(time);
  };
  const persist = () => {
    const bridge=window.openai;
    if(bridge && typeof bridge.setWidgetState==='function') bridge.setWidgetState({modelContent:{construction:'delivery_automatic_build_layered_wire_mesh'},privateContent:{time,writer:stateWriter}}).catch(()=>{});
  };
  const stop = () => {playing=false;previous=null;cancelAnimationFrame(raf);setButton(time>=total?'重播建造过程':'播放建造过程');};
  const animate = stamp => {
    if(!playing) return;
    if(previous!==null) time=Math.min(total,time+(stamp-previous)/1000);
    previous=stamp;draw();
    if(time>=total){stop();persist();}else raf=requestAnimationFrame(animate);
  };
  button.addEventListener('click',()=>{
    if(playing){stop();persist();return;}
    if(time>=total) time=0;
    if(reduceMotion){time=time<4?4:time<7?7:time<12?12:15;draw();stop();persist();return;}
    playing=true;previous=null;setButton('暂停',true);raf=requestAnimationFrame(animate);
  });
  slider.addEventListener('input',()=>{stop();time=Number(slider.value);draw();});
  slider.addEventListener('change',persist);
  const restore = saved => {if(saved?.privateContent?.writer===stateWriter) return;const value=saved?.privateContent?.time;if(typeof value==='number' && Number.isFinite(value)){stop();time=clamp(value,0,total);draw();}};
  restore(window.openai?.widgetState);
  window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
  new ResizeObserver(()=>{width=Math.max(280,root.clientWidth);height=clamp(width*.46,280,350);scale=Math.min(width/25,height/13);draw();}).observe(root);
  draw();
})();
</script>
