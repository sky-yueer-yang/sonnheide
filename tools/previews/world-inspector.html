<body>
<div class="banner"><strong>示例状态 · 非生产World</strong>　40类对象交互合同的离线原型。地图为原创示意图，不代表3D、GPU、完整经济或已接入C++世界。</div>
<header class="top"><div><h1>Sonnheide <span class="muted">世界档案</span></h1><p class="small muted">点地图，认人，沿关系找到他们的世界。</p></div><div class="top-actions"><button id="world-overview">世界总览</button><button id="favorites-open">收藏与标记</button><button id="compare-open">跨对象比较</button><button id="laws-open">世界规则</button><button id="clear-open" class="danger">分类清理</button></div></header>
<main class="workspace">
<aside class="panel directory"><div class="panel-head"><h2>对象目录</h2><p class="small muted">40种已定义对象，各有可跳转示例</p></div><div class="panel-body"><label class="small" for="search">搜索名称、类型或稳定ID</label><input id="search" type="search" placeholder="例如：林、语言、合同…" autocomplete="off"><div id="search-results" class="search-results" aria-live="polite"></div><nav id="directory" class="directory-list" aria-label="对象类型"></nav></div></aside>
<section class="panel map-panel"><div class="panel-head row between"><div><h2>青岬湾 · 示例地图</h2><p class="small muted">所有年龄人物使用相同体型标记，年龄仍有法律含义。</p></div><span class="pill" id="map-mode-label">近景：点选人物</span></div><div class="map-toolbar"><button id="tool-inspect" class="active">点选</button><button id="tool-spawn">连续放置人物 · 18岁</button><button id="tool-marker">放置地图标记</button><button id="zoom-mode">切换远观国家</button></div><div class="map-wrap"><svg id="world-map" viewBox="0 0 640 430" role="img" aria-label="可点击的示例地图"></svg></div><div class="map-caption stack"><div class="map-legend"><span><i class="dot"></i>人物 / 同尺度</span><span><i class="swatch"></i>青岬国家区域</span><span>★ 收藏 / ◇ 标记</span></div><p id="map-hint" class="small muted">近景点人物查看档案；切到远观后点国家区域。地形高程与比例已冻结。</p></div><div class="quick-links"><button id="birth-demo">演示一次合法繁衍事件</button><button id="open-archive">查看死亡档案</button></div><div class="panel-body" style="padding-top:0"><div class="hint">人口生成有两条不同来源：玩家连续放置固定18岁；出生事件由已配对成年双亲产生0岁新成员，受繁衍规则与事件幂等约束。</div></div></section>
<section class="panel inspector" aria-label="集中信息页"><div class="history-nav"><div class="row"><button id="nav-back" aria-label="上一浏览页">←</button><button id="nav-forward" aria-label="下一浏览页">→</button><span class="small muted" id="nav-position"></span></div><div class="row"><button id="return-map">返回地图</button><button id="favorite-current">☆ 收藏</button></div></div><div id="object-title" class="object-title"></div><nav id="object-tabs" class="tabs" aria-label="对象信息导航"></nav><div id="object-content" class="panel-body"></div></section>
</main>
<footer class="status-bar" id="status-bar"></footer>
